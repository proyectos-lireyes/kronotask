name: Compilar APK Android y Publicar Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PUBLIC_APK_DOWNLOAD_URL: "https://github.com/proyectos-lireyes/kronotask/releases/latest/download/app-release.apk"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      # Se inyecta el número de ejecución como versión de la app y el repo fijo
      - name: Compilar frontend web (Vite)
        env:
          VITE_GITHUB_REPO: proyectos-lireyes/kronotask
          VITE_APP_VERSION: 1.0.${{ github.run_number }}
          VITE_PUBLIC_APK_URL: https://github.com/proyectos-lireyes/kronotask/releases/latest/download/app-release.apk
        run: npm run build

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Generar Keystore de firma automática si no existe
        run: |
          mkdir -p android/app
          if [ ! -f android/app/release.keystore ]; then
            echo "Generando nuevo keystore con alias kronotask..."
            keytool -genkeypair -v -keystore android/app/release.keystore -alias kronotask -keyalg RSA -keysize 2048 -validity 10000 -storepass kronotask -keypass kronotask -dname "CN=KronoTask, OU=Mobile, O=KronoTask, L=City, S=State, C=US"
          else
            echo "Verificando alias kronotask en keystore existente..."
            if ! keytool -list -keystore android/app/release.keystore -storepass kronotask -alias kronotask >/dev/null 2>&1; then
              echo "El keystore existente no tiene el alias kronotask. Regenerando para sincronizar..."
              rm -f android/app/release.keystore
              keytool -genkeypair -v -keystore android/app/release.keystore -alias kronotask -keyalg RSA -keysize 2048 -validity 10000 -storepass kronotask -keypass kronotask -dname "CN=KronoTask, OU=Mobile, O=KronoTask, L=City, S=State, C=US"
            else
              echo "Keystore con alias kronotask verificado correctamente."
            fi
          fi

      - name: Compilar APK Firmado
        run: |
          cd android
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }} -PreleaseKeyAlias=kronotask -PreleaseKeyPassword=kronotask -PreleaseStorePassword=kronotask --stacktrace

      - name: Renombrar y preparar APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/KronoTask-v1.0.${{ github.run_number }}.apk

      # Publicación automática del Release en GitHub
      - name: Publicar Release en GitHub
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "KronoTask v1.0.${{ github.run_number }}"
          body: |
            ## 📱 KronoTask v1.0.${{ github.run_number }}
            👉 [Descargar app-release.apk](https://github.com/proyectos-lireyes/kronotask/releases/latest/download/app-release.apk)
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/KronoTask-v1.0.${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
