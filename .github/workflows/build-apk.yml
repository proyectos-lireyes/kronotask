name: Compilar APK Android y Publicar Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PUBLIC_APK_DOWNLOAD_URL: "https://github.com/proyectos-lireyes/kronotask/releases/latest/download/app-release.apk"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      # Se inyecta el número de ejecución como versión de la app y el repo fijo
      - name: Compilar frontend web (Vite)
        env:
          VITE_GITHUB_REPO: proyectos-lireyes/kronotask
          VITE_APP_VERSION: 1.0.${{ github.run_number }}
          VITE_PUBLIC_APK_URL: https://github.com/proyectos-lireyes/kronotask/releases/latest/download/app-release.apk
        run: npm run build

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Asegurar Keystore de firma único y permanente
        run: |
          mkdir -p android/app
          if [ ! -f android/app/release.keystore ] || [ ! -s android/app/release.keystore ]; then
            echo "Restaurando keystore permanente de firma fija..."
            echo "" | base64 -d > android/app/release.keystore
          fi
          echo "Keystore permanente verificado con éxito (tamaño: $(wc -c < android/app/release.keystore) bytes)."

      - name: Compilar APK Firmado
        run: |
          cd android
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }} -PreleaseKeyAlias=kronotask -PreleaseKeyPassword=kronotask -PreleaseStorePassword=kronotask --stacktrace

      - name: Renombrar y preparar APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/KronoTask-v1.0.${{ github.run_number }}.apk

      # Extraer las novedades y cambios reales a partir de los commits
      - name: Generar notas de novedades (Changelog)
        id: changelog
        run: |
          COMMITS=$(git log -n 5 --no-merges --pretty=format:"• %s" | grep -v "Merge" || true)
          if [ -z "$COMMITS" ]; then
            COMMITS="• Mejoras en la estabilidad, interfaz móvil y corrección de errores."
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Publicación automática del Release en GitHub con las notas reales
      - name: Publicar Release en GitHub
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "KronoTask v1.0.${{ github.run_number }}"
          body: |
            ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/KronoTask-v1.0.${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
